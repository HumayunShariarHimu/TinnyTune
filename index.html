<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinnyTune</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

#btn{
    width:70px;
    height:70px;
    border:2px solid #fff;
    border-radius:50%;
    background:#000;
    color:#fff;
    font-size:26px;
    cursor:pointer;

    display:flex;
    justify-content:center;
    align-items:center;

    box-shadow:
        0 0 10px #fff,
        0 0 20px #fff,
        0 0 40px #fff;

    transition:all .25s ease;
}

#btn:hover{
    transform:scale(1.08);
}

#btn:active{
    transform:scale(0.95);
}
</style>
</head>
<body>

<button id="btn">▶</button>

<audio id="audio" src="music.mp3"></audio>

<script>
const btn = document.getElementById("btn");
const audio = document.getElementById("audio");

btn.addEventListener("click", () => {
    if(audio.paused){
        audio.play();
        btn.textContent = "❚❚";
    } else {
        audio.pause();
        btn.textContent = "▶";
    }
});

audio.addEventListener("ended", () => {
    btn.textContent = "▶";
});
</script>

</body>
</html>
